<form [formGroup]="chatForm" (ngSubmit)="enviarMensaje()">
    <div class="flex flex-row items-center gap-2 w-full md:w-auto bg-white md:bg-transparent rounded-3xl mb-3 md:mb-0 grow md:max-w-[75%]">
        <app-button type="button" variant="icono" class="ml-2" (action)="audio()">
            <fa-icon [icon]="faMicrophone"></fa-icon>
        </app-button>
        <textarea rows="1" placeholder="¿A donde quieres viajar?" type="text" id="message" name="message" formControlName="message"></textarea>
    </div>
    <app-button class="md:max-w-[25%] @max-md:py-2 whitespace-nowrap" variant="redondo" type="submit" link="/planner" [disabled] = "false">Empezar a planear</app-button>
</form>
